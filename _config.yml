title: "自用稳定机场推荐分享，时不时检查一下还能打开不"
tagline: "自用稳定机场测评推荐"
description: "2026年最新稳定机场测评推荐。自用非广，3年+老牌翻墙机场。包括不限时流量不清零、低价大流量性价比、高可用多节点稳定等三种类型，同步分享各平台新手客户端配置教程与技术指南，定时更新最新可用官方文档"
lang: "zh-CN"

# 保持您原本的 Markdown 渲染機制
markdown: kramdown

# 網址設定
url: "https://airforceone.top"
baseurl: "" 

# 插件設定
plugins:
  - jekyll-titles-from-headings
  - jekyll-remote-theme          # 🌟 重點：啟用遠端主題插件（GitHub 官方允許的白名單外掛）

# 標題自動處理
titles_from_headings:
  enabled: true
  strip_title: true

# 讓首頁套用預設的主題排版
defaults:
  - scope:
      path: "" 
    values:
      layout: "default"
  - scope:
      path: "README.md"
    values:
      canonical: "https://airforceone.top"

# 🌟 重點修改處：
# 1. 註銷掉原本老舊的內建主題
# theme: jekyll-theme-cayman 

# 2. 改用由社群維護、完美支援 GA4 的最新遠端 Cayman 主題
remote_theme: jekyll-themes/cayman-theme

# 3. 填入你的 GA4 衡量 ID
google_analytics: G-BHRRD1DW3

