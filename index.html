<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在跳转 - 自用稳定机场推荐分享</title>
    
    <!-- 1. 核心重新导向：设置 0 秒立刻跳转到你的内页（请将下方最后的“你的内页名称”替换为实际的内页 URL 路径） -->
    <!-- 如果你是想跳转到另一个独立生成的内页，请修改下方 url/ 后面的内容 -->
    <meta http-equiv="refresh" content="0;url=https://airforceone.top">
    
    <!-- 2. 规范化标签：告诉 Bing 爬虫这个页面的核心主权在内页，传递 301 权重 -->
    <link rel="canonical" href="https://airforceone.top">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        a {
            color: #007bff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>正在前往首页内容</h2>
        <p>页面正在自动跳转，如果您的浏览器没有自动反应，请 <a href="https://airforceone.top">点击此处直接进入</a>。</p>
    </div>
</body>
</html>
