<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自用稳定机场推荐分享</title>
    <meta name="description" content="分享自用三年以上的稳定机场推荐与使用体验，整理不限时流量不清零、低价大流量和多节点高可用等不同类型的选择，并提供 Shadowrocket、Clash、FLClash 等客户端的配置教程与网络工具指南。内容会定期检查和更新，帮助你按日常流量、线路稳定性与设备需求查找合适的信息。">
    <link rel="canonical" href="https://airforceone.top/">
    <style>
      :root {
        color-scheme: light;
        --ink: #172033;
        --muted: #5d687b;
        --accent: #2563eb;
        --accent-dark: #1d4ed8;
        --surface: #ffffff;
        --background: #f4f7fb;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--background);
      }
      main {
        width: min(100%, 680px);
        padding: clamp(32px, 7vw, 64px);
        text-align: center;
        background: var(--surface);
        border: 1px solid #e5eaf2;
        border-radius: 16px;
        box-shadow: 0 16px 40px rgba(23, 32, 51, 0.08);
      }
      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.15;
        letter-spacing: -0.02em;
      }
      p {
        max-width: 560px;
        margin: 20px auto 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.8;
      }
      a.button {
        display: inline-block;
        margin-top: 32px;
        padding: 13px 22px;
        color: #fff;
        background: var(--accent);
        border-radius: 9px;
        font-weight: 700;
        text-decoration: none;
        transition: background-color 160ms ease, transform 160ms ease;
      }
      a.button:hover,
      a.button:focus-visible {
        background: var(--accent-dark);
        transform: translateY(-1px);
      }
      a.button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>自用稳定机场推荐分享</h1>
      <p>整理 2026 年稳定机场推荐、客户端配置教程与网络工具使用指南，并持续检查链接和内容可用性。</p>
      <a class="button" href="https://github.com/hm4reggggg/jichang">访问 GitHub 项目主页</a>
    </main>
  </body>
</html>
